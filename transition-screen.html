<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spice Cream Transition Test</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090909;
    }

    body {
      display: grid;
      place-items: center;
    }

    #game {
      width: min(100vw, calc(100vh * 1080 / 2048));
      height: min(100vh, calc(100vw * 2048 / 1080));
    }

    canvas {
      display: block;
    }

    #controls {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 2;
      width: min(360px, calc(100vw - 32px));
      padding: 16px;
      box-sizing: border-box;
      color: #ffffff;
      background: rgba(12, 12, 12, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      font: 14px Arial, sans-serif;
      backdrop-filter: blur(8px);
    }

    .control-row {
      display: grid;
      grid-template-columns: 24px 1fr 58px;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    input[type="range"] {
      width: 100%;
    }

    #copyPosition {
      width: 100%;
      min-height: 36px;
      color: #111111;
      background: #ffffff;
      border: 0;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    #positionOutput {
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.82);
      font-family: Consolas, monospace;
      font-size: 12px;
      line-height: 1.4;
      word-break: break-word;
    }

    #status {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 32px;
      box-sizing: border-box;
      color: #ffffff;
      font: 24px Arial, sans-serif;
      text-align: center;
      background: #090909;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="controls">
    <div class="control-row">
      <label for="groupX">X</label>
      <input id="groupX" type="range" min="-1200" max="2300" value="540">
      <span id="groupXValue">540</span>
    </div>
    <div class="control-row">
      <label for="groupY">Y</label>
      <input id="groupY" type="range" min="-600" max="2650" value="1024">
      <span id="groupYValue">1024</span>
    </div>
    <button id="copyPosition" type="button">Copy position</button>
    <div id="positionOutput">group.setPosition(540, 1024);</div>
  </div>
  <div id="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script>
    const GAME_WIDTH = 1080;
    const GAME_HEIGHT = 2048;
    const TRANSITION_IMAGE = 'Frame%20225287.png';
    const GROUP_IMAGE = 'Group%20230792.png';
    const status = document.getElementById('status');
    const groupX = document.getElementById('groupX');
    const groupY = document.getElementById('groupY');
    const groupXValue = document.getElementById('groupXValue');
    const groupYValue = document.getElementById('groupYValue');
    const copyPosition = document.getElementById('copyPosition');
    const positionOutput = document.getElementById('positionOutput');
    let groupImage = null;

    function showStatus(message) {
      status.textContent = message;
      status.style.display = 'grid';
    }

    function getGroupPositionText() {
      return `group.setPosition(${groupX.value}, ${groupY.value});`;
    }

    function updateGroupPosition() {
      groupXValue.textContent = groupX.value;
      groupYValue.textContent = groupY.value;
      positionOutput.textContent = getGroupPositionText();

      if (groupImage) {
        groupImage.setPosition(Number(groupX.value), Number(groupY.value));
      }
    }

    groupX.addEventListener('input', updateGroupPosition);
    groupY.addEventListener('input', updateGroupPosition);
    copyPosition.addEventListener('click', async () => {
      const positionText = getGroupPositionText();
      positionOutput.textContent = positionText;

      try {
        await navigator.clipboard.writeText(positionText);
        copyPosition.textContent = 'Copied';
        window.setTimeout(() => {
          copyPosition.textContent = 'Copy position';
        }, 900);
      } catch (error) {
        copyPosition.textContent = 'Select text below';
        window.setTimeout(() => {
          copyPosition.textContent = 'Copy position';
        }, 1400);
      }
    });

    if (!window.Phaser) {
      showStatus('Phaser did not load. Check your internet connection or CDN access.');
      throw new Error('Phaser did not load.');
    }

    class TransitionScene extends Phaser.Scene {
      constructor() {
        super('TransitionScene');
      }

      preload() {
        this.load.on('loaderror', (file) => {
          showStatus(`Could not load asset: ${file.src}`);
        });

        this.load.image('transition-frame', TRANSITION_IMAGE);
        this.load.image('transition-group', GROUP_IMAGE);
      }

      create() {
        this.cameras.main.setBackgroundColor('#090909');

        this.add.image(GAME_WIDTH / 2, GAME_HEIGHT / 2, 'transition-frame');

        groupImage = this.add.image(Number(groupX.value), Number(groupY.value), 'transition-group');
        updateGroupPosition();
      }
    }

    const game = new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game',
      width: GAME_WIDTH,
      height: GAME_HEIGHT,
      backgroundColor: '#090909',
      scene: TransitionScene,
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      }
    });
  </script>
</body>
</html>
