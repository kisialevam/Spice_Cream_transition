<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spice Cream Transition Test</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090909;
    }

    body {
      display: grid;
      place-items: center;
    }

    #game {
      width: min(100vw, calc(100vh * 1080 / 2048));
      height: min(100vh, calc(100vw * 2048 / 1080));
    }

    canvas {
      display: block;
    }

    #version {
      position: fixed;
      right: 10px;
      bottom: 8px;
      z-index: 3;
      color: rgba(255, 255, 255, 0.58);
      font: 12px Arial, sans-serif;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.65);
    }

    #status {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 32px;
      box-sizing: border-box;
      color: #ffffff;
      font: 24px Arial, sans-serif;
      text-align: center;
      background: #090909;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="version">v4.4</div>
  <div id="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script>
    const GAME_WIDTH = 1080;
    const GAME_HEIGHT = 2048;
    const TRANSITION_IMAGE = 'Frame%20225287.png';
    const GROUP_IMAGE = 'Group%20230792.png';
    const MONSTER_IMAGE = 'Krak.png';
    const WATER_MASK_IMAGE = 'wat.png';
    const BAT_SHEET = 'bat.png';
    const RAIN_IMAGE = 'rain.png';
    const LIGHT_FLASH_IMAGE = 'Rectangle.png';
    const LIGHT_IMAGES = ['light-1', 'light-2'];
    const LIGHT_SCALE = 0.65;
    const WAVE_IMAGES = ['wave-1', 'wave-2', 'wave-3', 'wave-4', 'wave-5'];
    const WAVE_SETTINGS = {
      moveSpeed: 1,
      growSpeed: 1.05,
      maxActive: 12,
      shrinkSpeed: 1.15
    };
    const WAVE_MIN_DISTANCE_Y = 120;
    const BAT_COUNT = 5;
    const BAT_FRAME = { width: 194, height: 136 };
    const BAT_FPS = 10;
    const BAT_SCALE = 0.78;
    const BAT_MIN_DISTANCE = 230;
    const GROUP_POSITION = { x: 540, y: 1282 };
    const GROUP_FLOAT_X = 58;
    const MONSTER_SETTINGS = {
      x: 540,
      y: 1112,
      scale: 1.035,
      waterlineOffsetY: 177,
      waterlineMin: 160,
      waterlineMax: 178
    };
    const RAIN_SETTINGS = {
      imageAngle: -30,
      fallSpeed: 2200,
      fallAngle: 24,
      spacing: 155,
      lastSpacing: 155,
      alpha: 0.4
    };
    const RAIN_MARGIN = 260;
    const status = document.getElementById('status');

    function showStatus(message) {
      status.textContent = message;
      status.style.display = 'grid';
    }

    if (!window.Phaser) {
      showStatus('Phaser did not load. Check your internet connection or CDN access.');
      throw new Error('Phaser did not load.');
    }

    class TransitionScene extends Phaser.Scene {
      constructor() {
        super('TransitionScene');
      }

      preload() {
        this.load.on('loaderror', (file) => {
          showStatus(`Could not load asset: ${file.src}`);
        });

        this.load.image('transition-frame', TRANSITION_IMAGE);
        this.load.image('transition-group', GROUP_IMAGE);
        this.load.image('monster', MONSTER_IMAGE);
        this.load.image('water-mask', WATER_MASK_IMAGE);
        this.load.image('rain', RAIN_IMAGE);
        this.load.image('light-flash', LIGHT_FLASH_IMAGE);
        this.load.image('light-1', 'light_1.png');
        this.load.image('light-2', 'light_2.png');
        this.load.image('wave-1', 'wave_1.png');
        this.load.image('wave-2', 'wave_2.png');
        this.load.image('wave-3', 'wave_3.png');
        this.load.image('wave-4', 'wave_4.png');
        this.load.image('wave-5', 'wave_5.png');
        this.load.spritesheet('bat', BAT_SHEET, {
          frameWidth: BAT_FRAME.width,
          frameHeight: BAT_FRAME.height
        });
      }

      moveBat(bat) {
        const target = this.getBatTarget(bat);
        const duration = Phaser.Math.Between(3200, 6200);

        bat.setFlipX(target.x < bat.x);

        this.tweens.add({
          targets: bat,
          x: target.x,
          y: target.y,
          rotation: Phaser.Math.FloatBetween(-0.18, 0.18),
          duration,
          ease: 'Cubic.easeInOut',
          onComplete: () => this.moveBat(bat)
        });
      }

      getBatTarget(currentBat) {
        for (let attempt = 0; attempt < 18; attempt += 1) {
          const target = {
            x: Phaser.Math.Clamp(currentBat.x + Phaser.Math.Between(-260, 260), -80, GAME_WIDTH + 80),
            y: Phaser.Math.Clamp(currentBat.y + Phaser.Math.Between(-140, 140), 80, 640)
          };
          const hasSpace = this.bats.every((bat) => {
            return bat === currentBat ||
              Phaser.Math.Distance.Between(target.x, target.y, bat.x, bat.y) >= BAT_MIN_DISTANCE;
          });

          if (hasSpace) {
            return target;
          }
        }

        return {
          x: Phaser.Math.Clamp(currentBat.x + Phaser.Math.Between(-180, 180), -80, GAME_WIDTH + 80),
          y: Phaser.Math.Clamp(currentBat.y + Phaser.Math.Between(-100, 100), 80, 640)
        };
      }

      addBat(index) {
        const laneWidth = GAME_WIDTH / BAT_COUNT;
        const bat = this.add.sprite(
          Phaser.Math.Between(index * laneWidth + 60, (index + 1) * laneWidth - 60),
          Phaser.Math.Between(95 + (index % 2) * 90, 430 + (index % 2) * 90),
          'bat'
        );

        bat
          .setDepth(8.5)
          .setScale(BAT_SCALE)
          .play('bat-flap');

        this.bats.push(bat);
        this.time.delayedCall(index * 180, () => this.moveBat(bat));
      }

      spawnLightning() {
        const textureKey = Phaser.Utils.Array.GetRandom(LIGHT_IMAGES);
        const lightning = this.add.image(
          Phaser.Math.Between(80, GAME_WIDTH - 80),
          0,
          textureKey
        );

        lightning
          .setOrigin(0.5, 0)
          .setDepth(20)
          .setScale(LIGHT_SCALE)
          .setAlpha(0)
          .setBlendMode(Phaser.BlendModes.ADD);

        this.tweens.add({
          targets: lightning,
          alpha: 1,
          duration: Phaser.Math.Between(35, 70),
          yoyo: true,
          hold: Phaser.Math.Between(35, 90),
          ease: 'Quad.easeOut',
          onComplete: () => lightning.destroy()
        });

        this.flashLightningOverlay();
      }

      flashLightningOverlay() {
        this.tweens.killTweensOf(this.lightningFlash);
        this.lightningFlash.setAlpha(0);

        this.tweens.add({
          targets: this.lightningFlash,
          alpha: 0.85,
          duration: 35,
          yoyo: true,
          hold: 28,
          ease: 'Quad.easeOut'
        });
      }

      scheduleLightning() {
        this.time.delayedCall(Phaser.Math.Between(1600, 6200), () => {
          const flashes = Phaser.Math.Between(1, 100) <= 18 ? 2 : 1;

          for (let index = 0; index < flashes; index += 1) {
            this.time.delayedCall(index * Phaser.Math.Between(180, 520), () => {
              this.spawnLightning();
            });
          }

          this.scheduleLightning();
        });
      }

      addRain() {
        if (this.rainDrops) {
          this.rainDrops.forEach((rain) => rain.destroy());
        }

        const spacingX = RAIN_SETTINGS.spacing;
        const spacingY = RAIN_SETTINGS.spacing;
        const rows = Math.ceil((GAME_HEIGHT + RAIN_MARGIN * 2) / spacingY) + 1;
        const columns = Math.ceil((GAME_WIDTH + RAIN_MARGIN * 2) / spacingX) + 2;

        this.rainDrops = [];
        this.rainLoopHeight = rows * spacingY;
        this.rainLoopWidth = columns * spacingX;

        for (let row = 0; row < rows; row += 1) {
          for (let column = 0; column < columns; column += 1) {
            const zigzagOffsetY = column % 2 === 0 ? 0 : spacingY / 2;
            const rain = this.add.image(
              -RAIN_MARGIN + column * spacingX,
              -RAIN_MARGIN + row * spacingY + zigzagOffsetY,
              'rain'
            );

            rain
              .setDepth(30)
              .setAngle(RAIN_SETTINGS.imageAngle)
              .setAlpha(RAIN_SETTINGS.alpha);

            this.rainDrops.push(rain);
          }
        }
      }

      applyRainSettings() {
        if (!this.rainDrops) {
          return;
        }

        this.rainDrops.forEach((rain) => {
          rain.setAngle(RAIN_SETTINGS.imageAngle);
          rain.setAlpha(RAIN_SETTINGS.alpha);
        });

        if (RAIN_SETTINGS.spacing !== RAIN_SETTINGS.lastSpacing) {
          RAIN_SETTINGS.lastSpacing = RAIN_SETTINGS.spacing;
          this.addRain();
        }
      }

      updateRain(delta) {
        const seconds = delta / 1000;
        const fallAngleRadians = Phaser.Math.DegToRad(RAIN_SETTINGS.fallAngle);
        const moveX = Math.sin(fallAngleRadians) * RAIN_SETTINGS.fallSpeed * seconds;
        const moveY = Math.cos(fallAngleRadians) * RAIN_SETTINGS.fallSpeed * seconds;
        const loopDrift = this.rainLoopHeight * Math.tan(fallAngleRadians);

        this.rainDrops.forEach((rain) => {
          rain.x += moveX;
          rain.y += moveY;

          if (rain.y > GAME_HEIGHT + RAIN_MARGIN) {
            rain.y -= this.rainLoopHeight;
            rain.x -= loopDrift;
          }

          while (rain.x > GAME_WIDTH + RAIN_MARGIN) {
            rain.x -= this.rainLoopWidth;
          }

          while (rain.x < -RAIN_MARGIN) {
            rain.x += this.rainLoopWidth;
          }
        });
      }

      getWaveSpawnY() {
        for (let attempt = 0; attempt < 16; attempt += 1) {
          const y = Phaser.Math.Between(860, GAME_HEIGHT);
          const hasEnoughSpace = this.activeWaves.every((wave) => {
            return Math.abs(wave.y - y) >= WAVE_MIN_DISTANCE_Y;
          });

          if (hasEnoughSpace) {
            return y;
          }
        }

        return Phaser.Math.Between(860, GAME_HEIGHT);
      }

      spawnWave() {
        if (this.activeWaves.length >= WAVE_SETTINGS.maxActive) {
          return;
        }

        const direction = Phaser.Math.Between(0, 1) === 0 ? -1 : 1;
        const startX = Phaser.Math.Between(430, 650);
        const startY = this.getWaveSpawnY();
        const driftSpeedVariant = Phaser.Math.FloatBetween(0.45, 1.25);
        const perspectiveProgress = Phaser.Math.Clamp((startY - 860) / (GAME_HEIGHT - 860), 0, 1);
        const perspectiveDriftSpeed = Phaser.Math.Linear(0.35, 1, perspectiveProgress);
        const driftDistance =
          Phaser.Math.Between(150, 360) *
          WAVE_SETTINGS.moveSpeed *
          driftSpeedVariant *
          perspectiveDriftSpeed;
        const endX = startX + direction * driftDistance;
        const availableWaves = startY >= 1450
          ? WAVE_IMAGES
          : WAVE_IMAGES.filter((textureKey) => textureKey !== 'wave-1');
        const textureKey = Phaser.Utils.Array.GetRandom(availableWaves);
        const perspectiveScale = Phaser.Math.Linear(
          0.28,
          1,
          perspectiveProgress
        );
        const wave = this.add.image(startX, startY, textureKey);

        wave
          .setOrigin(0.5, 1)
          .setDepth(6 + startY / GAME_HEIGHT)
          .setAlpha(1)
          .setBlendMode(Phaser.BlendModes.NORMAL)
          .setScale(perspectiveScale, 0);

        this.activeWaves.push(wave);

        const targetScaleY = Phaser.Math.FloatBetween(0.35, 1);
        const largeWaveSlowdown = Phaser.Math.Linear(1, 1.65, targetScaleY);
        const growDuration =
          (Phaser.Math.Between(260, 480) * largeWaveSlowdown) / WAVE_SETTINGS.growSpeed;
        const shrinkDuration = Phaser.Math.Between(340, 680) / WAVE_SETTINGS.shrinkSpeed;
        const driftDuration = growDuration + shrinkDuration;

        this.tweens.add({
          targets: wave,
          x: endX,
          y: startY + Phaser.Math.Between(-18, 18),
          duration: driftDuration,
          ease: 'Linear',
          onUpdate: () => {
            wave.setDepth(6 + wave.y / GAME_HEIGHT);
          }
        });

        this.tweens.add({
          targets: wave,
          scaleY: targetScaleY,
          duration: growDuration,
          ease: 'Cubic.easeOut',
          onComplete: () => {
            this.tweens.add({
              targets: wave,
              scaleY: 0,
              duration: shrinkDuration,
              ease: 'Cubic.easeIn',
              onComplete: () => {
                this.activeWaves = this.activeWaves.filter((item) => item !== wave);
                wave.destroy();
              }
            });
          }
        });
      }

      scheduleWaveSpawn() {
        this.time.delayedCall(Phaser.Math.Between(120, 430), () => {
          this.spawnWave();
          this.scheduleWaveSpawn();
        });
      }

      addMonster() {
        this.monsterMaskGraphics = this.make.graphics({ add: false });
        this.monsterMask = this.monsterMaskGraphics.createGeometryMask();
        this.monster = this.add.image(MONSTER_SETTINGS.x, MONSTER_SETTINGS.y, 'monster')
          .setDepth(9)
          .setMask(this.monsterMask);
        this.monsterWater = this.add.image(MONSTER_SETTINGS.x, MONSTER_SETTINGS.y, 'water-mask')
          .setDepth(9.5);
        this.monsterWaterlineState = {
          offsetY: MONSTER_SETTINGS.waterlineMin
        };

        this.tweens.add({
          targets: this.monsterWaterlineState,
          offsetY: MONSTER_SETTINGS.waterlineMax,
          duration: 1450,
          ease: 'Sine.easeInOut',
          yoyo: true,
          repeat: -1
        });

        this.updateMonster();
      }

      updateMonster() {
        if (!this.monster || !this.monsterWater || !this.monsterMaskGraphics) {
          return;
        }

        this.monster
          .setPosition(MONSTER_SETTINGS.x, MONSTER_SETTINGS.y)
          .setScale(MONSTER_SETTINGS.scale);

        const monsterTop = this.monster.y - this.monster.displayHeight / 2;
        const monsterLeft = this.monster.x - this.monster.displayWidth / 2;
        const waterlineOffsetY = this.monsterWaterlineState
          ? this.monsterWaterlineState.offsetY
          : MONSTER_SETTINGS.waterlineOffsetY;
        const waterlineY =
          monsterTop + this.monster.displayHeight / 2 + waterlineOffsetY;

        this.monsterMaskGraphics.clear();
        this.monsterMaskGraphics.fillStyle(0xffffff);
        this.monsterMaskGraphics.fillRect(
          monsterLeft,
          monsterTop,
          this.monster.displayWidth,
          waterlineY - monsterTop
        );

        this.monsterWater
          .setPosition(MONSTER_SETTINGS.x, waterlineY)
          .setScale(MONSTER_SETTINGS.scale);
      }

      create() {
        window.transitionScene = this;
        this.cameras.main.setBackgroundColor('#090909');
        this.activeWaves = [];
        this.bats = [];

        this.add.image(GAME_WIDTH / 2, GAME_HEIGHT / 2, 'transition-frame');

        this.lightningFlash = this.add.image(GAME_WIDTH / 2, GAME_HEIGHT / 2, 'light-flash')
          .setDepth(25)
          .setAlpha(0)
          .setBlendMode(Phaser.BlendModes.ADD);

        this.anims.create({
          key: 'bat-flap',
          frames: this.anims.generateFrameNumbers('bat', { start: 0, end: 2 }),
          frameRate: BAT_FPS,
          repeat: -1
        });

        const group = this.add.image(GROUP_POSITION.x, GROUP_POSITION.y, 'transition-group')
          .setDepth(5);

        this.tweens.add({
          targets: group,
          x: GROUP_POSITION.x + GROUP_FLOAT_X,
          duration: 1150,
          ease: 'Quad.easeInOut',
          yoyo: true,
          repeat: -1
        });

        this.scheduleWaveSpawn();
        this.addMonster();

        for (let index = 0; index < BAT_COUNT; index += 1) {
          this.addBat(index);
        }

        this.addRain();
        this.scheduleLightning();
      }

      update(time, delta) {
        this.updateMonster();

        if (this.rainDrops) {
          this.updateRain(delta);
        }
      }
    }

    const game = new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game',
      width: GAME_WIDTH,
      height: GAME_HEIGHT,
      backgroundColor: '#090909',
      scene: TransitionScene,
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      }
    });
  </script>
</body>
</html>
